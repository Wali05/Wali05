<svg xmlns="http://www.w3.org/2000/svg" width="148" height="38" viewBox="0 0 148 38">
  <defs>
    <linearGradient id="bgGrad_github_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <linearGradient id="borderGrad_github_light" x1="0" y1="0" x2="0" y2="1">
