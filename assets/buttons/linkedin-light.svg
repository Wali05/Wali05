<svg xmlns="http://www.w3.org/2000/svg" width="148" height="38" viewBox="0 0 148 38">
  <defs>
    <linearGradient id="bgGrad_linkedin_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f6f8fa" />
    </linearGradient>
    <linearGradient id="borderGrad_linkedin_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d7de" />
      <stop offset="100%" stop-color="#afb8c1" />
    </linearGradient>
    <filter id="glassShadow_linkedin_light" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(31, 35, 40, 0.08)" />
    </filter>
  </defs>

  <!-- Button Base Glass Card -->
  <rect x="1" y="1" width="146" height="36" rx="9" fill="#ffffff" filter="url(#glassShadow_linkedin_light)"/>
  <rect x="1" y="1" width="146" height="36" rx="9" fill="url(#bgGrad_linkedin_light)"/>
  <rect x="1" y="1" width="146" height="36" rx="9" fill="none" stroke="url(#borderGrad_linkedin_light)" stroke-width="1"/>
  
  <!-- Top Specular Glass Shine Line -->
  <line x1="12" y1="2" x2="136" y2="2" stroke="rgba(255, 255, 255, 0.8)" stroke-width="1" stroke-linecap="round"/>

  <!-- Icon Container -->
  <g transform="translate(14, 10.0)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
  <rect x="1" y="1" width="22" height="22" rx="4" fill="#0A66C2" fill-opacity="0.15" stroke="#0A66C2" stroke-width="1.6"/>
  <path d="M7 9v8M7 6v.01M12 17v-5a2.5 2.5 0 0 1 5 0v5m-5-3.5a2.5 2.5 0 0 1 5 0" stroke="#0A66C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
  </g>

  <!-- Button Label -->
  <text x="42" y="23.5" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.2">LinkedIn</text>

  <!-- Subtle Navigation Indicator -->
  <g transform="translate(126, 14.0)">
    <path d="M1 1 L5 5 L1 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>