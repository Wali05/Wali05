  <!-- Moving Terminal Scanline Cursor (Active during 5s reveal) -->
  <line x1="42" y1="36" x2="328" y2="36" stroke="#1f2328" stroke-width="1.5" opacity="0.85">
    <animate attributeName="y1" from="36" to="472" dur="5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.1 0.7 0.2 1" />
    <animate attributeName="y2" from="36" to="472" dur="5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.1 0.7 0.2 1" />
    <animate attributeName="opacity" values="0.85;0.95;0.8;0.2;0" keyTimes="0;0.5;0.8;0.95;1" dur="5s" fill="freeze" />
  </line>
