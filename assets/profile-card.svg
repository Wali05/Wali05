<svg xmlns="http://www.w3.org/2000/svg" width="370" height="488" viewBox="0 0 370 488" role="img" aria-label="Wali05 ASCII Portrait">
  <defs>
    <!-- Glassmorphic Gradients -->
    <linearGradient id="glassBgGrad_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    <linearGradient id="glassBorderGrad_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="glassShadow_dark" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(0, 0, 0, 0.55)" />
    </filter>

    <!-- Smooth 5-second terminal scan wipe (cinematic rasterization) -->
    <clipPath id="portraitScanWipe_dark">
      <rect x="0" y="0" width="370" height="0">
        <animate attributeName="height" from="36" to="488" dur="5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.1 0.7 0.2 1" />
      </rect>
    </clipPath>
  </defs>

  <!-- Glassmorphic Card Container -->
  <rect x="1" y="1" width="368" height="486" rx="10" fill="#0d1117" filter="url(#glassShadow_dark)"/>
  <rect x="1" y="1" width="368" height="486" rx="10" fill="url(#glassBgGrad_dark)"/>
  <rect x="1" y="1" width="368" height="486" rx="10" fill="none" stroke="url(#glassBorderGrad_dark)" stroke-width="1.2"/>
  
  <!-- Glass Top Specular Shine Line -->
  <line x1="16" y1="2" x2="354" y2="2" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-linecap="round"/>

  <!-- Frosted Terminal Title Bar -->
  <path d="M 1,10.5 A 9.5,9.5 0 0,1 10.5,1 L 359.5,1 A 9.5,9.5 0 0,1 369,10.5 L 369,36 L 1,36 Z" fill="rgba(255, 255, 255, 0.05)"/>
  <line x1="1" y1="36" x2="369" y2="36" stroke="url(#glassBorderGrad_dark)" stroke-width="0.8"/>
  
  <!-- Terminal Window Controls -->
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="18" r="5" fill="#27c93f"/>
  
  <!-- Terminal Title -->
  <text x="185.0" y="22" fill="#8b949e" font-family="'Consolas', 'Menlo', monospace" font-size="11" font-weight="500" text-anchor="middle">wali@systems: ~ /portrait.asc</text>

